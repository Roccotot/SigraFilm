<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sigra Film - Servizi professionali per cinema, eventi e audiovisivi a Firenze. Vendita, noleggio e assistenza tecnica.">
  <title>Sigra Film | Cinema, Audio, Video, Eventi</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background-color: #f4f4f4;
      color: #333;
      line-height: 1.6;
    }

    /* ----- HEADER CON BANNER ----- */
    header {
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                  url('img/banner_cinema.jpg') center/cover no-repeat;
      color: #fff;
      text-align: center;
      padding: 80px 10px 40px;
      position: relative;
    }

    header::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: #d12b2b;
    }

    header img {
      width: 200px;
      height: auto;
      margin-bottom: 15px;
      background: rgba(255,255,255,0.9);
      padding: 10px 20px;
      border-radius: 10px;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
      letter-spacing: 1px;
      color: #f9c200;
      text-shadow: 1px 1px 4px #000;
    }

    header p {
      color: #eee;
      font-size: 1.2rem;
      text-shadow: 1px 1px 3px #000;
    }

    /* ----- CAROSELLO ----- */
    .carousel {
      position: relative;
      width: 100%;
      max-width: 1100px;
      margin: 30px auto;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .carousel img {
      width: 100%;
      display: none;
      height: auto;
    }

    .carousel img.active {
      display: block;
      animation: fade 1s ease-in-out;
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ----- NAVBAR ----- */
    nav {
      background: #222;
      text-align: center;
      padding: 10px 0;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    nav a:hover {
      color: #f9c200;
    }

    /* ----- SEZIONI ----- */
    section {
      background: #fff;
      margin: 30px auto;
      padding: 30px;
      max-width: 1100px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
      color: #d12b2b;
      border-bottom: 2px solid #d12b2b;
      padding-bottom: 5px;
    }

    ul {
      list-style-type: square;
      padding-left: 20px;
    }

    .button {
      display: inline-block;
      background: #d12b2b;
      color: #fff;
      text-decoration: none;
      padding: 12px 25px;
      border-radius: 30px;
      font-weight: bold;
      margin-top: 20px;
      transition: background 0.3s;
    }

    .button:hover {
      background: #f9c200;
      color: #000;
    }

    .contacts {
      background: #222;
      color: #fff;
      padding: 40px 20px;
      text-align: center;
    }

    .contacts a {
      color: #f9c200;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      background: #000;
      color: #aaa;
      text-align: center;
      padding: 15px;
      font-size: 0.9rem;
    }

    /* ----- STRUMENTI ONLINE ----- */
    #strumenti {
      background: linear-gradient(145deg, #b31313, #d12b2b);
      color: #fff;
      text-align: center;
      padding: 60px 20px;
      margin-top: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    #strumenti h2 {
      color: #fff;
      border: none;
      font-size: 2rem;
      margin-bottom: 15px;
    }

    #strumenti a {
      display: inline-block;
      margin: 15px 10px;
      background: #f9c200;
      color: #000;
      font-weight: bold;
      padding: 12px 25px;
      border-radius: 30px;
      text-decoration: none;
      transition: 0.3s;
    }

    #strumenti a:hover {
      background: #fff;
      color: #d12b2b;
    }

    @media (max-width: 768px) {
      header img { width: 140px; }
      header h1 { font-size: 1.8rem; }
      header { padding: 60px 10px 30px; }
      section { padding: 20px; }
    }
  </style>
</head>
<body>

  <header>
    <img src="img/logo_sigra.png" alt="Logo Sigra Film">
    <h1>SIGRA FILM</h1>
    <p>Specialisti in proiezione cinematografica, eventi e tecnologie audiovisive</p>
  </header>

  <!-- ✅ CAROSELLO AUTOMATICO -->
  <div class="carousel" id="carousel"></div>

  <nav>
    <a href="#chisiamo">Chi Siamo</a>
    <a href="#strumenti">Strumenti</a>
    <a href="#servizi">Servizi</a>
    <a href="#noleggio">Noleggio</a>
    <a href="#marchi">Marchi</a>
    <a href="#contatti">Contatti</a>
  </nav>

  <!-- ... resto del tuo codice invariato ... -->

  <footer>
    © 2025 Sigra Film | Powered by Rocco Totaro
  </footer>

  <!-- ✅ SCRIPT PER IL CAROSELLO -->
  <script>
    // Percorso della cartella
    const folder = 'caroselli/';
    const totalImages = 10; // numero massimo previsto (puoi aumentarlo)
    const images = [];

    // Carica automaticamente immagini esistenti (C1.jpg, C2.jpg, ecc.)
    for (let i = 1; i <= totalImages; i++) {
      const img = new Image();
      img.src = `${folder}C${i}.jpg`;
      img.onerror = () => {}; // ignora se non esiste
      img.onload = () => {
        images.push(img);
        if (images.length === 1) showImage(0);
      };
    }

    let current = 0;

    function showImage(index) {
      const carousel = document.getElementById('carousel');
      carousel.innerHTML = ''; // pulisce
      const img = images[index];
      if (img) {
        img.classList.add('active');
        carousel.appendChild(img);
      }
    }

    // Cambio automatico ogni 4 secondi
    setInterval(() => {
      if (images.length > 0) {
        current = (current + 1) % images.length;
        showImage(current);
      }
    }, 4000);
  </script>

</body>
</html>
