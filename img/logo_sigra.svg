<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- Gradient rosso → verde → blu orizzontale sull'intero canvas -->
    <linearGradient id="rg" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#cc0000"/>
      <stop offset="48%"  stop-color="#00bb00"/>
      <stop offset="100%" stop-color="#0000cc"/>
    </linearGradient>

    <!-- Clip path per ritagliare il gradiente sulla forma delle lettere SIGRA -->
    <clipPath id="sc">
      <text x="250" y="285"
            text-anchor="middle"
            font-family="'Arial Black', Impact, sans-serif"
            font-size="165"
            font-weight="900"
            letter-spacing="-2">SIGRA</text>
    </clipPath>
  </defs>

  <!-- Sfondo bianco con angoli arrotondati -->
  <rect width="500" height="500" rx="55" fill="white"/>

  <!-- Bordo con gradiente -->
  <rect x="6" y="6" width="488" height="488" rx="50"
        fill="none" stroke="url(#rg)" stroke-width="10"/>

  <!-- SIGRA: riempito con gradiente + 3 tagli bianchi orizzontali -->
  <g clip-path="url(#sc)">
    <rect width="500" height="500" fill="url(#rg)"/>
    <!-- i tre tagli bianchi dividono le lettere in 4 fasce uguali -->
    <rect x="0" y="196" width="500" height="8" fill="white"/>
    <rect x="0" y="226" width="500" height="8" fill="white"/>
    <rect x="0" y="256" width="500" height="8" fill="white"/>
  </g>

  <!-- FILM: effetto tratto triplo italic con gradiente -->
  <g font-family="Arial, Helvetica, sans-serif"
     font-size="90"
     font-style="italic"
     font-weight="bold"
     fill="none"
     stroke="url(#rg)"
     stroke-width="2.2"
     letter-spacing="12">
    <text x="44"  y="446">FILM</text>
    <text x="49"  y="451">FILM</text>
    <text x="54"  y="456">FILM</text>
    <text x="59"  y="461">FILM</text>
  </g>
</svg>
